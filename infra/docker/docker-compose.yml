services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: tasksdb
      POSTGRES_USER: devops
      POSTGRES_PASSWORD: devops
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../db/init_db.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devops -d tasksdb"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ../../backend
    environment:
      PORT: 3000
      DATABASE_URL: postgres://devops:devops@db:5432/tasksdb
      # Secret de developpement uniquement : il est en clair dans le depot, donc
      # public. Les environnements Kubernetes et Render utilisent leur propre
      # valeur, generee aleatoirement et jamais versionnee.
      JWT_SECRET: dev-only-secret-not-for-production
    ports:
      - "3000:3000"
    volumes:
      - ../../backend/src:/app/src
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ../../frontend
    environment:
      VITE_API_URL: http://localhost:3000
    ports:
      - "5173:5173"
    volumes:
      - ../../frontend/src:/app/src
      - ../../frontend/index.html:/app/index.html:ro
    depends_on:
      - backend

volumes:
  postgres_data:

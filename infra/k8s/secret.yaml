# =====================================================================
# ATTENTION - Secret de DEMONSTRATION
# ---------------------------------------------------------------------
# Un Secret Kubernetes n'est PAS chiffre : les valeurs sont seulement
# encodees en base64, donc lisibles par quiconque a acces au manifest ou
# a l'API du cluster. Le versionner dans Git est acceptable ICI parce que
# les identifiants sont ceux d'une base de demo jetable.
#
# En production on utiliserait, au choix :
#   - Sealed Secrets / SOPS (secret chiffre, versionnable sans risque)
#   - un gestionnaire externe (Vault, AWS Secrets Manager) via CSI driver
#   - le chiffrement at-rest d'etcd + RBAC strict sur les Secrets
# Voir docs/decisions.md.
# =====================================================================
apiVersion: v1
kind: Secret
metadata:
  name: tasks-secret
  labels:
    app.kubernetes.io/part-of: devops-tasks-board
type: Opaque
# stringData : Kubernetes encode en base64 tout seul, le manifest reste lisible.
stringData:
  POSTGRES_PASSWORD: "devops"
  DATABASE_URL: "postgres://devops:devops@postgres-service:5432/tasksdb"

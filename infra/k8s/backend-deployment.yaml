apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels:
    app: backend
    app.kubernetes.io/part-of: devops-tasks-board
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: tasks/backend:latest
          # Image construite dans le demon Docker de Minikube, pas sur un registre.
          imagePullPolicy: IfNotPresent
          # L'image lance "npm run dev" (node --watch) pour le confort local.
          # Dans le cluster on veut le process de production.
          command: ["npm", "start"]
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: tasks-config
                  key: PORT
            # URL complete avec credentials : Secret, jamais ConfigMap
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: tasks-secret
                  key: DATABASE_URL
            # Sans cette cle le backend refuse de demarrer : c'est voulu, un
            # secret manquant doit faire echouer le deploiement, pas produire
            # une application qui signe des jetons avec une valeur par defaut.
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: tasks-secret
                  key: JWT_SECRET
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            # /health renvoie 503 si la base est injoignable : seuil large pour
            # ne pas redemarrer le backend a cause d'une indisponibilite DB.
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi

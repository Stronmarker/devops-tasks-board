apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  labels:
    app: postgres
    app.kubernetes.io/part-of: devops-tasks-board
spec:
  replicas: 1
  # Recreate : le volume est ReadWriteOnce, deux pods ne peuvent pas le monter
  # simultanement pendant un rolling update.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:15-alpine
          ports:
            - name: postgres
              containerPort: 5432
          env:
            # Identifiants non sensibles : ConfigMap
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: tasks-config
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: tasks-config
                  key: POSTGRES_USER
            # Mot de passe : Secret
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: tasks-secret
                  key: POSTGRES_PASSWORD
            # Sous-repertoire dedie : le point de montage du PVC n'est pas vide
            # (lost+found), ce qui ferait echouer initdb a la racine.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
            - name: postgres-init
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "devops", "-d", "tasksdb"]
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "devops", "-d", "tasksdb"]
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: postgres-pvc
        # ConfigMap generee depuis infra/db/init_db.sql (voir make k8s-init)
        - name: postgres-init
          configMap:
            name: postgres-init-sql

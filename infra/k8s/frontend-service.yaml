apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  labels:
    app: frontend
    app.kubernetes.io/part-of: devops-tasks-board
spec:
  # NodePort : point d'entree de l'application.
  # Docker Desktop mappe le nodePort directement sur localhost:30080
  # (avec Minikube : minikube service frontend-service)
  type: NodePort
  selector:
    app: frontend
  ports:
    - name: http
      port: 5173
      targetPort: http
      nodePort: 30080
